appId: com.lnwjing.desktop
productName: lnwjing
asar: true
# Avoid expensive maximum-compression 7z work on local one-click portable builds.
compression: normal
toolsets:
  appimage: 1.0.3
npmRebuild: false
directories:
  output: dist/installers
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
publish:
  provider: github
  owner: crystalicez
  repo: lnwjing
  releaseType: release
afterPack: scripts/capture-packaged-runtime-evidence.mjs
afterSign: scripts/capture-packaged-runtime-evidence.mjs
extraResources:
  - from: build/tunnel-client
    to: tunnel-client
  - from: build/runtime-tools
    to: runtime-tools
  - from: build/ecc-runtime
    to: ecc-runtime
  - from: ../../.agents/skills/lnwjing-scheduled-continuation
    to: agent-skills/lnwjing-scheduled-continuation
  - from: ../../.agents/skills/ponytail
    to: agent-skills/ponytail
  - from: ../../.agents/skills/ponytail-review
    to: agent-skills/ponytail-review
  - from: ../../.agents/skills/ponytail-audit
    to: agent-skills/ponytail-audit
  - from: ../../.agents/skills/ponytail-debt
    to: agent-skills/ponytail-debt
  - from: ../../.agents/skills/ponytail-gain
    to: agent-skills/ponytail-gain
  - from: ../../.agents/skills/ponytail-help
    to: agent-skills/ponytail-help
# Target-native STDIO launchers invoke the packaged Electron host. No private
# Node runtime or duplicated CJS entry is shipped.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: lnwjing-Setup-${version}.${ext}
  # Keep the branded icon embedded in lnwjing.exe for Windows shortcuts and taskbar.
  signAndEditExecutable: true
  extraFiles:
    - from: build/lnwjing-mcp-stdio.cmd
      to: lnwjing-mcp-stdio.cmd
  extraResources:
    - from: build/capability-bridge/windows-capability-bridge.ps1
      to: windows-capability-bridge.ps1
    - from: build/capability-bridge/windows-capability-bridge.sha256
      to: windows-capability-bridge.sha256
    - from: build/capability-bridge/windows-capability-bridge.integrity.json
      to: windows-capability-bridge.integrity.json
    - from: ../../native/windows-ocr/bin/lnwjing-windows-ocr.exe
      to: windows-ocr/lnwjing-windows-ocr.exe
    - from: ../../native/windows-secret-migrator/bin/win-x64
      to: windows-secret-migrator
mac:
  sign: scripts/sign-macos-runtime.mjs
  icon: build/icon-1024.png
  hardenedRuntime: true
  # Certificate-safe defaults. The custom signer selects dedicated ad-hoc
  # variants only when the resolved identity is exactly '-'.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSAccessibilityUsageDescription: lnwjing uses Accessibility only after you approve a native UI action.
    NSScreenCaptureUsageDescription: lnwjing uses Screen Recording only for an explicitly requested capture.
    NSMicrophoneUsageDescription: lnwjing uses the microphone only for an explicitly requested audio task.
    NSAppleEventsUsageDescription: lnwjing uses Apple Events only for an explicitly approved Office action.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: lnwjing-${version}-${arch}.${ext}
  extraFiles:
    - from: build/lnwjing-mcp-stdio.sh
      # Shell scripts belong in Resources, not the signed-code area at Contents.
      to: Resources/lnwjing-mcp-stdio
  extraResources:
    - from: build/native-host/macos
      to: native-host/macos
linux:
  executableName: lnwjing
  maintainer: Adisorn <engasnm111@users.noreply.github.com>
  icon: build/icons
  category: Development
  synopsis: Local AI-agent runtime and MCP gateway
  description: Cross-platform local MCP gateway with host-native permissions and bounded providers.
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  # Keep release filenames aligned with runtime evidence (x64, not amd64/x86_64).
  artifactName: lnwjing-${version}-${env.LNWJING_RUNTIME_ARCH}.${ext}
  extraFiles:
    - from: build/lnwjing-mcp-stdio.sh
      to: lnwjing-mcp-stdio
  extraResources:
    - from: build/native-host/linux
      to: native-host/linux
nsis:
  oneClick: false
  perMachine: false
  # Preserve the historical per-user default (%LOCALAPPDATA%\Programs\lnwjing).
  # All-users remains an explicit installer-page choice instead of the default.
  selectPerMachineByDefault: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Create the Start Menu link in installer.nsh from $INSTDIR so no build-user path can be baked in.
  createStartMenuShortcut: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: ${productName}
  include: build/installer.nsh
portable:
  artifactName: lnwjing-Portable-${version}.${ext}
  splashImage: build/portable-splash.bmp
